name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pkgcheck:
    name: Lint with pkgcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run pkgcheck
        uses: pkgcore/pkgcheck-action@v1
        with:
          args: -k=-UnusedProfileDirs

  release-canary:
    name: Semantic Release (dry run)
    runs-on: ubuntu-latest
    needs: [pkgcheck]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # dry-run against master itself: on pull_request refs semantic-release
      # bails out before verifying push credentials, which is the failure
      # mode this canary exists to catch
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic Release dry run
        uses: cycjimmy/semantic-release-action@v6
        with:
          dry_run: true
          ci: false
          # hide the GHA env so semantic-release uses the checked-out master
          # instead of bailing out on the refs/pull/N/merge ref
          unset_gha_env: true
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [pkgcheck]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
