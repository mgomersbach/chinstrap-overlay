extends:
  - '@commitlint/config-conventional'
rules:
  # conventional types plus the overlay's own release-rules types
  type-enum:
    - 2
    - always
    - [build, bump, chore, ci, docs, feat, fix, keyword, perf, refactor, revert, style, test]
  # Allow any case in subject (for package names, etc.)
  subject-case:
    - 0
    - always
    - sentence-case
  header-case:
    - 0
    - always
    - sentence-case
  # Allow longer bodies for detailed commit messages
  body-max-line-length:
    - 0
    - always
    - 200
